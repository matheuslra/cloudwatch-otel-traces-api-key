name: Claude security review

# Separate from security.yml so a pull request from a fork can't stop the secret scan and smoke test.
# The shared workflow skips forks and fetches its API key from AWS.
on:
  pull_request:

permissions:
  contents: read

jobs:
  claude-review:
    uses: matheuslra/security-workflows/.github/workflows/claude-review.yml@main
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    secrets:
      SECURITY_REVIEW_ROLE_ARN: ${{ secrets.SECURITY_REVIEW_ROLE_ARN }}
